# YOLO11m-BiFPN-EMA-SEAM: Multi-Breed Occlusion-Aware Pig Face Detector
# Scales YOLO11m [0.50, 1.00, 512] with BiFPN weighted cross-scale fusion + EMA_SEAM on P3/P4/P5.

nc: 1
scales:
  m: [0.50, 1.00, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3, ch=512)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4, ch=512)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (P5, ch=512)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, BiFPN_Concat, [1, 2]] # 12 (BiFPN weighted P5_up + P4)
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, BiFPN_Concat, [1, 2]] # 15 (BiFPN weighted P4_up + P3)
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8, ch=256)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13, 6], 1, BiFPN_Concat, [1, 3]] # 18 (BiFPN 3-way P4 cross-scale skip!)
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16, ch=512)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, BiFPN_Concat, [1, 2]] # 21 (BiFPN weighted P4_down + P5)
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32, ch=512)

  # Occlusion-aware attention (EMA + SEAM) before Detect(P3, P4, P5)
  - [16, 1, EMA_SEAM, [256]] # 23
  - [19, 1, EMA_SEAM, [512]] # 24
  - [22, 1, EMA_SEAM, [512]] # 25

  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
