# YOLO11s-SEAM-EMA: Occlusion-Aware Pig Face Detector
# Combines YOLO11s backbone/neck (100% COCO weight transferable for layers 0..22)
# with EMA (DESA-YOLO / YOLO-ESO 2026) and SEAM (YOLO-FaceV2) before Detect(P3, P4, P5).

nc: 1
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # 18
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32)

  # Occlusion-aware attention modules (EMA + SEAM) before detection heads
  - [16, 1, EMA_SEAM, [128]] # 23 (P3/8 occlusion-enhanced)
  - [19, 1, EMA_SEAM, [256]] # 24 (P4/16 occlusion-enhanced)
  - [22, 1, EMA_SEAM, [512]] # 25 (P5/32 occlusion-enhanced)

  - [[23, 24, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
